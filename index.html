<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Steins;Gate - Προσκλητήριο Γάμου</title>
<link href="https://googleapis.com" rel="stylesheet">
<style>
  :root {
    --bg-dark: #101113;
    --env-front: #2a2d32;
    --env-side: #23262a;
    --env-back: #1b1d20;
    --env-flap-outer: #32363c;
    --env-flap-inner: #1e2024;
    --amber-glow: #ff8c00;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background-color: var(--bg-dark);
    background-image: radial-gradient(circle at center, #1e2125 0%, #090a0b 100%);
    font-family: 'Courier Prime', monospace;
    color: #d0ccc4;
    overflow: hidden;
    perspective: 1500px;
  }

  /* Σκοτεινό πέπλο που εμφανίζεται πίσω από την κάρτα σε πρώτο πλάνο */
  .backdrop {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.78);
    backdrop-filter: blur(4px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.6s ease 0.7s;
    z-index: 15;
  }

  .backdrop.active {
    opacity: 1;
    pointer-events: auto;
  }

  .top-hud {
    position: absolute;
    top: 15px;
    width: 90%;
    max-width: 460px;
    display: flex;
    justify-content: space-between;
    font-size: 0.82rem;
    color: var(--amber-glow);
    text-shadow: 0 0 8px rgba(255, 140, 0, 0.6);
    border-bottom: 1px solid rgba(255, 140, 0, 0.3);
    padding-bottom: 6px;
    z-index: 30;
  }

  /* Κοντέινερ Φακέλου */
  .scene {
    position: relative;
    width: 330px;
    height: 220px;
    margin-top: 60px;
    transform-style: preserve-3d;
    transition: transform 0.8s cubic-bezier(0.25, 1, 0.5, 1);
    z-index: 20;
  }

  /* Όταν ανοίγει, ο φάκελος κατεβαίνει λίγο για να βγει άνετα η κάρτα */
  .scene.open {
    transform: translateY(110px);
  }

  .envelope {
    position: relative;
    width: 100%;
    height: 100%;
    background-color: var(--env-back);
    border-radius: 4px;
    box-shadow: 0 25px 60px rgba(0, 0, 0, 0.9);
    cursor: pointer;
    transform-style: preserve-3d;
  }

  /* Καπάκι Φακέλου */
  .flap-container {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 130px;
    transform-origin: top center;
    transform-style: preserve-3d;
    transition: transform 0.75s cubic-bezier(0.4, 0, 0.2, 1);
    z-index: 6;
  }

  .flap-outer {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 165px solid transparent;
    border-right: 165px solid transparent;
    border-top: 130px solid var(--env-flap-outer);
    filter: drop-shadow(0 6px 8px rgba(0, 0, 0, 0.55));
    backface-visibility: hidden;
  }

  .flap-inner {
    position: absolute;
    top: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 165px solid transparent;
    border-right: 165px solid transparent;
    border-top: 130px solid var(--env-flap-inner);
    transform: rotateY(180deg);
    backface-visibility: hidden;
  }

  /* Σφραγίδα Γρανάζι */
   .seal {
    position: absolute;
    top: 82px;      /* Ανέβηκε λίγο για να κεντραριστεί τέλεια */
    left: 50%;
    transform: translateX(-50%) translateZ(2px);
    width: 90px;    /* Μεγαλύτερο μέγεθος για κινητά */
    height: 90px;
    background: transparent;
    border: none;
    box-shadow: none;
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 7;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.35s ease 0.15s;
  }

  .seal img {
    width: 100%;
    height: 100%;
    object-fit: contain;
    filter: drop-shadow(0 4px 8px rgba(0, 0, 0, 0.7)); /* Φυσική σκιά πάνω στον φάκελο */
  }

  .envelope:hover:not(.open) .seal {
    transform: translateX(-50%) translateZ(2px) scale(1.08) rotate(30deg);
  }

  /* Τσέπη Φακέλου */
  .pocket-left {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 0;
    border-top: 110px solid transparent;
    border-bottom: 110px solid transparent;
    border-left: 170px solid var(--env-side);
    z-index: 4;
  }

  .pocket-right {
    position: absolute;
    bottom: 0;
    right: 0;
    width: 0;
    height: 0;
    border-top: 110px solid transparent;
    border-bottom: 110px solid transparent;
    border-right: 170px solid var(--env-side);
    z-index: 4;
  }

  .pocket-bottom {
    position: absolute;
    bottom: 0;
    left: 0;
    width: 0;
    height: 0;
    border-left: 165px solid transparent;
    border-right: 165px solid transparent;
    border-bottom: 120px solid var(--env-front);
    z-index: 5;
    filter: drop-shadow(0 -3px 6px rgba(0,0,0,0.45));
    border-radius: 0 0 4px 4px;
  }

  .lab-stamp {
    position: absolute;
    bottom: 10px;
    right: 12px;
    font-size: 0.6rem;
    color: rgba(255, 255, 255, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.25);
    padding: 2px 5px;
    letter-spacing: 1px;
    z-index: 6;
    pointer-events: none;
  }

  /* Η ΕΙΚΟΝΑ ΤΟΥ ΠΡΟΣΚΛΗΤΗΡΙΟΥ */
  .card-image-wrapper {
    position: absolute;
    bottom: 10px;
    left: 15px;
    width: 300px;
    height: 195px;
    border-radius: 4px;
    overflow: hidden;
    box-shadow: 0 4px 15px rgba(0,0,0,0.7);
    z-index: 2;
    background: #1a1a1a;
    transition: all 0.5s ease;
  }

  .card-image-wrapper img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: top center;
    display: block;
  }

  /* Κουμπί κλεισίματος πάνω στην κάρτα */
  .close-btn {
    position: absolute;
    top: 10px;
    right: 10px;
    width: 30px;
    height: 30px;
    background: rgba(16, 17, 19, 0.85);
    color: var(--amber-glow);
    border: 1px solid var(--amber-glow);
    border-radius: 50%;
    font-size: 15px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.3s ease 1.1s, transform 0.2s;
    z-index: 50;
  }

  .close-btn:hover {
    transform: scale(1.1);
    background: var(--amber-glow);
    color: #000;
  }

  /* ΚΑΤΑΣΤΑΣΗ ΑΝΟΙΧΤΟΥ ΦΑΚΕΛΟΥ */
  .envelope.open .seal {
    transform: translateX(-50%) rotate(360deg) scale(0);
    opacity: 0;
    pointer-events: none;
  }

  .envelope.open .flap-container {
    transform: rotateX(180deg);
    z-index: 1;
    transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1) 0.1s, z-index 0s 0.35s;
  }

  /* Animation 2 σταδίων: 1) Βγαίνει από τον φάκελο -> 2) Έρχεται πρώτο πλάνο */
  .envelope.open .card-image-wrapper {
    animation: pullAndZoomMobile 1.35s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
  }

  .envelope.open .close-btn {
    opacity: 1;
    pointer-events: auto;
  }

  @keyframes pullAndZoomMobile {
    0% {
      transform: translateY(0) translateZ(0) scale(1);
      height: 195px;
      z-index: 2;
    }
    45% {
      /* Βγαίνει τελείως πάνω από το χείλος του φακέλου */
      transform: translateY(-230px) translateZ(10px) scale(1);
      height: 230px;
      z-index: 2;
    }
    50% {
      /* Περνάει μπροστά από τον φάκελο */
      z-index: 100;
    }
    100% {
      /* Κατεβαίνει μπροστά από τον φάκελο στο κέντρο της οθόνης */
      transform: translateY(-60px) translateZ(80px) scale(1.1);
      height: 450px;
      z-index: 100;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95), 0 0 25px rgba(255, 140, 0, 0.3);
    }
  }

  .instruction {
    margin-top: 25px;
    font-size: 0.82rem;
    color: #888;
    letter-spacing: 1px;
    transition: opacity 0.4s;
    z-index: 20;
  }

  .scene.open ~ .instruction {
    opacity: 0;
  }

  /* Προσαρμογή για μεγαλύτερες οθόνες (Desktop / Tablet) */
  @media (min-width: 600px) {
    .scene { width: 400px; height: 260px; }
    .scene.open { transform: translateY(130px); }
    .flap-container { height: 150px; }
    .flap-outer, .flap-inner {
      border-left-width: 200px; border-right-width: 200px; border-top-width: 150px;
    }
    .seal {
      top: 98px;
      width: 105px;
      height: 105px;
    }
    .pocket-left { border-top-width: 130px; border-bottom-width: 130px; border-left-width: 205px; }
    .pocket-right { border-top-width: 130px; border-bottom-width: 130px; border-right-width: 205px; }
    .pocket-bottom { border-left-width: 200px; border-right-width: 200px; border-bottom-width: 140px; }
    .card-image-wrapper { width: 370px; left: 15px; height: 230px; }

    .envelope.open .card-image-wrapper {
      animation: pullAndZoomDesktop 1.35s cubic-bezier(0.22, 1, 0.36, 1) 0.85s forwards;
    }
  }

  @keyframes pullAndZoomDesktop {
    0% {
     transform: translateY(0) translateZ(0) scale(1);
      height: 230px;
      z-index: 2;
    }
    45% {
      transform: translateY(-270px) translateZ(10px) scale(1);
      height: 270px;
      z-index: 2;
    }
    50% {
      z-index: 100;
    }
    100% {
      transform: translateY(-70px) translateZ(80px) scale(1.15);
      height: 555px;
      z-index: 100;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.95), 0 0 30px rgba(255, 140, 0, 0.3);
    }
  }
  /* ΚΑΤΑΣΤΑΣΗ ΚΛΕΙΣΙΜΑΤΟΣ (Μπαίνει 100% μέσα πριν κλείσει το καπάκι) */
  .envelope.closing .card-image-wrapper {
    animation: putBackMobile 1.2s cubic-bezier(0.22, 1, 0.36, 1) forwards;
  }

  /* Το καπάκι περιμένει 1.25s (να μπει η κάρτα μέσα) και μετά κλείνει */
  .envelope.closing .flap-container {
    transform: rotateX(0deg);
    z-index: 6;
    transition: transform 0.65s cubic-bezier(0.4, 0, 0.2, 1) 1.25s, z-index 0s 1.25s;
  }

  /* Η σφραγίδα εμφανίζεται αφού κλείσει το καπάκι (1.75s) */
  .envelope.closing .seal {
    transform: translateX(-50%) translateZ(2px) rotate(0deg) scale(1);
    opacity: 1;
    transition: transform 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) 1.75s, opacity 0.3s ease 1.75s;
  }

  @keyframes putBackMobile {
    0% {
      transform: translateY(-60px) translateZ(80px) scale(1.1);
      height: 450px;
      z-index: 100;
      box-shadow: 0 35px 80px rgba(0, 0, 0, 0.95);
    }
    45% {
      /* Μηδενίζουμε το translateZ ώστε να περάσει πίσω από την τσέπη */
      transform: translateY(-230px) translateZ(0px) scale(1);
      height: 230px;
      z-index: 100;
    }
    48% {
      z-index: 2;
    }
    100% {
      transform: translateY(0) translateZ(0px) scale(1);
      height: 195px;
      z-index: 2;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    }
  }

  @keyframes putBackDesktop {
    0% {
      transform: translateY(-70px) translateZ(80px) scale(1.15);
      height: 555px;
      z-index: 100;
      box-shadow: 0 40px 90px rgba(0, 0, 0, 0.95);
    }
    45% {
      transform: translateY(-270px) translateZ(0px) scale(1);
      height: 270px;
      z-index: 100;
    }
    48% {
      z-index: 2;
    }
    100% {
      transform: translateY(0) translateZ(0px) scale(1);
      height: 230px;
      z-index: 2;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
    }
  }

  /* Κουμπί Χάρτη (Google Maps) */
  .map-buttons-container {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    display: flex;
    gap: 10px;
    width: 92%;
    max-width: 440px;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease 1.5s, transform 0.4s ease 1.5s;
    z-index: 200;
  }

  .map-buttons-container.visible {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }

  /* Στυλ για το κάθε κουμπί */
  .map-btn {
    flex: 1;
    text-align: center;
    background: rgba(18, 19, 21, 0.94);
    color: var(--amber-glow);
    border: 1.5px solid var(--amber-glow);
    padding: 11px 10px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.78rem;
    font-weight: bold;
    letter-spacing: 0.5px;
    text-decoration: none;
    border-radius: 4px;
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.9), 0 0 12px rgba(255, 140, 0, 0.35);
    transition: background 0.2s, color 0.2s, transform 0.2s;
  }

  .map-btn:hover {
    background: var(--amber-glow);
    color: #000;
    transform: translateY(-2px);
  }
  .seal img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
  /* Κουμπί ελέγχου μουσικής πάνω δεξιά */
  .music-btn {
    position: fixed;
    top: 52px;
    right: 20px;
    background: rgba(18, 19, 21, 0.9);
    color: var(--amber-glow);
    border: 1px solid var(--amber-glow);
    padding: 6px 12px;
    font-family: 'Courier Prime', monospace;
    font-size: 0.75rem;
    border-radius: 4px;
    cursor: pointer;
    box-shadow: 0 0 10px rgba(255, 140, 0, 0.3);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease, background 0.2s, color 0.2s;
    z-index: 250;
  }

  .music-btn.visible {
    opacity: 1;
    pointer-events: auto;
  }

  .music-btn:hover {
    background: var(--amber-glow);
    color: #000;
  }
  
</style>
</head>
<body>

  <div class="backdrop" id="backdrop" onclick="toggleEnvelope()"></div>

  <div class="top-hud">
    <span>DIVERGENCE: 1.048596%</span>
    <span id="status-text">✉ D-MAIL [LOCKED]</span>
  </div>

  <div class="scene" id="scene">
    <div class="envelope" id="envelope" onclick="openEnvelope()">
      <div class="flap-container">
        <div class="flap-outer"></div>
        <div class="flap-inner"></div>
      </div>
      
      <div class="seal">
  <img src="seal.png" alt="Σφραγίδα">
</div>
      
      <div class="pocket-left"></div>
      <div class="pocket-right"></div>
      <div class="pocket-bottom"></div>
      <div class="lab-stamp">FUTURE GADGET LAB</div>
      
      <div class="card-image-wrapper">
        <button class="close-btn" onclick="closeEnvelope(event)" title="Κλείσιμο">✕</button>
        <img src="prosklitirio.png" alt="Προσκλητήριο Γάμου Steins;Gate">
      </div>
    </div>
  </div>

  <p class="instruction">[ Πατήστε στη σφραγίδα για άνοιγμα D-Mail ]</p>
  <div class="map-buttons-container" id="map-buttons">
    <a href="https://maps.app.goo.gl/vKex8TJ99PNYCLLM9" target="_blank" class="map-btn">
      📍 ΕΚΚΛΗΣΙΑ
    </a>
    <a href="https://maps.app.goo.gl/iJy8NLnbGQCDKQGd9" target="_blank" class="map-btn">
      🥂 ΚΕΝΤΡΟ
    </a>
  </div>
  </a>
  
 <audio id="bg-music" src="music.mp3" loop preload="auto"></audio>
  <button class="music-btn" id="music-btn" onclick="toggleMusic()">🔊 SOUND: ON</button>
  
  <script>
     function playPaperSound(isOpening) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const oscGain = ctx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(isOpening ? 240 : 180, ctx.currentTime);
        osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.08);
        oscGain.gain.setValueAtTime(0.25, ctx.currentTime);
        oscGain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.08);
        osc.connect(oscGain);
        oscGain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.08);

        const duration = 0.6;
        const bufferSize = ctx.sampleRate * duration;
        const buffer = ctx.createBuffer(1, bufferSize, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;

        const filter = ctx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(1100, ctx.currentTime + 0.15);
        filter.frequency.linearRampToValueAtTime(2200, ctx.currentTime + 0.5);
        filter.Q.value = 1.2;

        const noiseGain = ctx.createGain();
        noiseGain.gain.setValueAtTime(0.001, ctx.currentTime + 0.15);
        noiseGain.gain.linearRampToValueAtTime(0.14, ctx.currentTime + 0.35);
        noiseGain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.15 + duration);

        noise.connect(filter);
        filter.connect(noiseGain);
        noiseGain.connect(ctx.destination);

        noise.start(ctx.currentTime + 0.15);
        noise.stop(ctx.currentTime + 0.15 + duration);
      } catch (e) {}
    }

    function openEnvelope() {
      const envelope = document.getElementById('envelope');
      if (envelope.classList.contains('open')) return;
document.getElementById('map-buttons').classList.add('visible');
      document.getElementById('scene').classList.add('open');
      document.getElementById('backdrop').classList.add('active');
      envelope.classList.add('open');
      playPaperSound(true);
      document.getElementById('status-text').textContent = '✉ D-MAIL [DECRYPTED]';
    }
    let musicStarted = false;

    function openEnvelope() {
      const envelope = document.getElementById('envelope');
      if (envelope.classList.contains('open')) return;

      document.getElementById('scene').classList.add('open');
      document.getElementById('backdrop').classList.add('active');
      document.getElementById('map-buttons').classList.add('visible');
      envelope.classList.add('open');
      playPaperSound(true);
      document.getElementById('status-text').textContent = '✉ D-MAIL [DECRYPTED]';

      // Ξεκινάει η μουσική με το άνοιγμα του φακέλου
      const music = document.getElementById('bg-music');
      const musicBtn = document.getElementById('music-btn');
      musicBtn.classList.add('visible');
      
      if (!musicStarted) {
        music.volume = 0.6; // Ένταση στο 60%
        music.play().then(() => {
          musicStarted = true;
          musicBtn.textContent = '🔊 SOUND: ON';
        }).catch(() => {
          musicBtn.textContent = '🔇 SOUND: OFF';
        });
      }
    }

    function toggleMusic() {
      const music = document.getElementById('bg-music');
      const musicBtn = document.getElementById('music-btn');
      if (music.paused) {
        music.play();
        musicBtn.textContent = '🔊 SOUND: ON';
      } else {
        music.pause();
        musicBtn.textContent = '🔇 SOUND: OFF';
      }
    }

    function closeEnvelope(e) {
      if (e) e.stopPropagation();
      const envelope = document.getElementById('envelope');
      if (!envelope.classList.contains('open') || envelope.classList.contains('closing')) return;
document.getElementById('map-buttons').classList.remove('visible');
      document.getElementById('backdrop').classList.remove('active');
      envelope.classList.remove('open');
      envelope.classList.add('closing');
      playPaperSound(false);
      document.getElementById('status-text').textContent = '✉ D-MAIL [LOCKED]';

      // Μόλις μπει η κάρτα μέσα, ο φάκελος επανέρχεται στο κέντρο
      setTimeout(() => {
        document.getElementById('scene').classList.remove('open');
      }, 1250);

      // Καθαρισμός κλάσης μόλις ολοκληρωθεί όλο το κλείσιμο
      setTimeout(() => {
        envelope.classList.remove('closing');
      }, 2300);
    }

    function toggleEnvelope() {
      const envelope = document.getElementById('envelope');
      if (envelope.classList.contains('open')) {
        closeEnvelope();
      } else {
        openEnvelope();
      }
    }
  </script>

</body>
</html>
